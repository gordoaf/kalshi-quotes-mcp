[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kalshi-quotes-mcp"
version = "0.1.0"
description = "Read-only Kalshi market quotes for AI assistants, with batch lookups and precise prices."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "gordoaf"}]
keywords = ["kalshi", "mcp", "prediction-markets", "quotes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = ["mcp>=2.3,<3", "httpx>=0.28.1,<1"]

[project.scripts]
kalshi-quotes-mcp = "kalshi_quotes_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/gordoaf/kalshi-quotes-mcp"
Issues = "https://github.com/gordoaf/kalshi-quotes-mcp/issues"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.0,<2", "ruff>=0.14,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_quotes_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
